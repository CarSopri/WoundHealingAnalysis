
[Thresholding]
# Color threshold (in Grayscale) for eliminating possible shadows in the image
shadow_threshold_color = 0.25 # Pixels with a value below this will be considered shadow
shadow_segment_threshold_color = 0.6 # Segments with a value higher than this will be considered shadow
wound_threshold = 0.6 # As a factor for mean image intensity

[BandPass]
# In px
min_bp_filter = 3
max_bp_filter = 40

[Blur]
gaussian_blur_sigma = 5

[Felzenszwalb]
#****cómo le llaman a estos en documentación Felzenszwalb ?
meansize_wound = 150000 #*** esto probablemente debería depender del tamaño de la imagen? y del tamaño relativo que esperás que tenga la herida. capaz debería ser un %
minsize_wound = 75000
max_tries = 15 # Number of attempts to try before declaring segmentation failed

[ProbableWoundPosition]
margin = 40 # Smallest wound width before deciding that segmentation becomes unreliable (minimum is zero)
# As fraction of image's width; to check if segment found was uncentered and/or too close to the border, so it won't be flagged as the wound
max_left_wall_wound_position = 0.2
wound_centre = 0.5
max_right_wall_wound_position = 0.8
# Check if segment is too big to be the wound
max_area_fraction = 0.5 # As a fraction of total image area h*w
# Check if maybe a second segment might also be a part of the wound
merge_distance = 300 # Max distance in px at which two segments have to be in order to be considered part of the same wound
